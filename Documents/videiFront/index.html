<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel = "stylesheet" href="style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-XB5tmk4mjL/TETWtIgIhrgMyVUwT09V5dumk9Y9Zlv8SkWd/Vje2pS9IzR0FPLCcaM5QZ+COw+RgPR+jAun5BA==" crossorigin="anonymous" />

    <title>Vidie</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #151f27;">
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item">
            <a class="nav-link" href="#" onclick="showGenerate()">Generation</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" onclick="showNarraton()">Narrator</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" onclick="showNarraton()">Videos</a>
          </li>
        </ul>
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link text-white" href="#">Sun<i class="fas fa-sun"></i></a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" href="#">Info<i class="fas fa-info-circle"></i></a>
          </li>
        </ul>
      </div>
    </nav>

    <div class="container" id="generateSection">
      <div class="row">
        <div class="col">
          <img src="imageone.png">
        </div>
        <div class="col">
          <h1 class="video-generator">Video Generation</h1>
          <br>
          <label for="Prompt">Prompt:</label><br>
          <input type="text" id="Prompt" name="Prompt" placeholder="about the fall of icarus">
          <br><br>
          <label for="Audience">Audience:</label><br>
          <input type="text" id="Audience" name="Audience" placeholder="">
          <br><br>
          <label for="Genre">Genre:</label><br>
          <input type="text" id="Genre" name="Genre" placeholder="">
          <br><br>
          <label for="cars">Avatar:</label>
          <br>
          <select name="cars" id="cars">
            <option value="No-avatar">No Avatar</option>
            <option value="saab">Saab</option>
            <option value="mercedes">Mercedes</option>
            <option value="audi">Audi</option>
          </select>
          <br><br>
          <label for="cars">Image Mode :</label>
          <br>
          <select name="cars" id="cars">
            <option value="No-avatar">No Avatar</option>
            <option value="saab">Saab</option>
            <option value="mercedes">Mercedes</option>
            <option value="audi">Audi</option>
          </select>
          <br><br>
          <label for="Music">Music:</label><br>
          <input type="text" id="Music" name="Music" placeholder="">
          <br><br>
          <div class="text-center">
            <input type="submit" class="button-generate" value="Create Video">
          </div>
        </div>
      </div>
    </div>

    <div class="container" id="narratorSection" style="display: none;">
        <div class="row">
            <div class="col">
              <img src="austro.png">
            </div>
            <div class="col">
              <h1 class="video-generator">Narrator Creation</h1>
              <br>
              <label for="Name">Name :</label><br>
              <input type="text" id="Name" name="Name" placeholder="">
              <br><br>
              <label for="Voice">Voice :</label>
              <br>
              <select name="Voice" id="Voice">
                <option value="No-avatar">Select Voice</option>
                <option value="saab">Saab</option>
                <option value="mercedes">Mercedes</option>
                <option value="audi">Audi</option>
              </select>
              <br><br>
              <label for="Genders">Genders :</label>
              <br>
              <select name="Genders" id="Genders">
                <option value="No-avatar">Male</option>
                <option value="saab">Saab</option>
                <option value="mercedes">Mercedes</option>
                <option value="audi">Audi</option>
              </select>
              <br><br>
              <label > Επιλογή αρχείου</label>
             <form action="#" method="post" enctype="multipart/form-data">
                <input type="file" name="image" accept="image/*">
                <br><br> 
            </form>
              <br><br>
              <div class="text-center">
                <input type="submit" class="button-generate" value="Submit">
              </div>
            </div>
          </div>
      
    </div>

    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

    <script>
      function showGenerate() {
        document.getElementById("generateSection").style.display = "block";
        document.getElementById("narratorSection").style.display = "none";
      }

      function showNarraton() {
        document.getElementById("generateSection").style.display = "none";
        document.getElementById("narratorSection").style.display = "block";
      }
    </script>
  </body>
</html>
